<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Do You Love Me? ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: "Arial", sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at top left, #ffb6c9, transparent 40%),
                radial-gradient(circle at bottom right, #ff4d88, transparent 40%),
                linear-gradient(135deg, #ff758c, #ff7eb3);

            position: relative;
        }

        /* ---------------- CARD ---------------- */

        .card {
            width: 90%;
            max-width: 520px;
            min-height: 350px;

            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);

            border-radius: 30px;
            padding: 45px 25px;

            text-align: center;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.25);

            position: relative;
            z-index: 10;

            animation: cardAppear 1s ease;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* ---------------- HEART ---------------- */

        .big-heart {
            font-size: 75px;
            animation: heartbeat 1.2s infinite;
            margin-bottom: 15px;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.18);
            }
        }

        /* ---------------- TITLE ---------------- */

        h1 {
            color: #ff3f6c;
            font-size: 38px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #777;
            font-size: 17px;
            margin-bottom: 35px;
        }

        /* ---------------- BUTTONS ---------------- */

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        button {
            border: none;
            outline: none;

            padding: 14px 30px;

            border-radius: 50px;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;
        }

        #yesBtn {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: white;

            box-shadow: 0 8px 20px rgba(255, 65, 108, 0.35);
        }

        #yesBtn:hover {
            transform: scale(1.1);
            box-shadow: 0 12px 25px rgba(255, 65, 108, 0.5);
        }

        #noBtn {
            background: #555;
            color: white;

            position: fixed;

            transition:
                left 0.15s ease,
                top 0.15s ease;
        }

        /* ---------------- SUCCESS ---------------- */

        #success {
            display: none;
        }

        #success h2 {
            color: #ff3f6c;
            font-size: 38px;
            margin-bottom: 15px;
        }

        #success p {
            color: #666;
            font-size: 20px;
            line-height: 1.6;
        }

        .love-text {
            font-size: 55px;
            margin: 15px 0;
        }

        /* ---------------- FLOATING HEARTS ---------------- */

        .heart {
            position: absolute;
            bottom: -50px;

            font-size: 25px;

            animation: floatUp linear infinite;

            opacity: 0.8;

            z-index: 1;
        }

        @keyframes floatUp {

            0% {
                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            100% {
                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }
        }

        /* ---------------- MOBILE ---------------- */

        @media (max-width: 600px) {

            .card {
                padding: 35px 20px;
            }

            h1 {
                font-size: 30px;
            }

            .big-heart {
                font-size: 65px;
            }

            .subtitle {
                font-size: 15px;
            }

            button {
                padding: 12px 24px;
                font-size: 16px;
            }

            #success h2 {
                font-size: 30px;
            }

            #success p {
                font-size: 17px;
            }
        }

    </style>
</head>

<body>


    <!-- Floating Hearts -->

    <div class="heart" style="left:5%; animation-duration:8s;">❤️</div>
    <div class="heart" style="left:15%; animation-duration:10s; animation-delay:2s;">💕</div>
    <div class="heart" style="left:28%; animation-duration:7s; animation-delay:1s;">💖</div>
    <div class="heart" style="left:40%; animation-duration:11s; animation-delay:3s;">💗</div>
    <div class="heart" style="left:55%; animation-duration:9s; animation-delay:2s;">❤️</div>
    <div class="heart" style="left:70%; animation-duration:12s; animation-delay:1s;">💘</div>
    <div class="heart" style="left:85%; animation-duration:8s; animation-delay:4s;">💕</div>
    <div class="heart" style="left:95%; animation-duration:10s;">❤️</div>


    <!-- Main Card -->

    <div class="card">

        <div id="question">

            <div class="big-heart">
                ❤️
            </div>

            <h1>
                Do you love me?
            </h1>

            <p class="subtitle">
                Be honest... 😌💕
            </p>


            <div class="buttons">

                <button id="yesBtn">
                    Yes ❤️
                </button>

                <button id="noBtn">
                    No 😢
                </button>

            </div>

        </div>


        <!-- Success Screen -->

        <div id="success">

            <div class="love-text">
                💖🥰💖
            </div>

            <h2>
                I knew it! 😍
            </h2>

            <p>
                You just made my heart<br>
                very, very happy! ❤️
            </p>

            <div class="love-text">
                💕✨💕
            </div>

        </div>

    </div>


    <script>

        const noBtn = document.getElementById("noBtn");
        const yesBtn = document.getElementById("yesBtn");

        const question = document.getElementById("question");
        const success = document.getElementById("success");


        /* --------------------------------
           MOVE NO BUTTON
        -------------------------------- */

        function moveNoButton() {

            const buttonWidth = noBtn.offsetWidth;
            const buttonHeight = noBtn.offsetHeight;

            const maxX = window.innerWidth - buttonWidth - 15;
            const maxY = window.innerHeight - buttonHeight - 15;


            const randomX =
                Math.floor(Math.random() * Math.max(maxX, 20));

            const randomY =
                Math.floor(Math.random() * Math.max(maxY, 20));


            noBtn.style.left = randomX + "px";
            noBtn.style.top = randomY + "px";
        }


        /* Desktop */

        noBtn.addEventListener("mouseenter", function () {

            moveNoButton();

        });


        /* Mobile */

        noBtn.addEventListener("touchstart", function (event) {

            event.preventDefault();

            moveNoButton();

        });


        /* Click করলে আরও একবার পালাবে */

        noBtn.addEventListener("click", function () {

            moveNoButton();

        });


        /* --------------------------------
           YES BUTTON
        -------------------------------- */

        yesBtn.addEventListener("click", function () {

            question.style.display = "none";

            noBtn.style.display = "none";

            success.style.display = "block";

            createCelebration();

        });


        /* --------------------------------
           HEART CELEBRATION
        -------------------------------- */

        function createCelebration() {

            const hearts = [
                "❤️",
                "💖",
                "💕",
                "💗",
                "💘",
                "🥰",
                "😍"
            ];


            for (let i = 0; i < 40; i++) {

                const heart = document.createElement("div");

                heart.innerHTML =
                    hearts[Math.floor(Math.random() * hearts.length)];

                heart.style.position = "fixed";

                heart.style.left =
                    Math.random() * 100 + "vw";

                heart.style.top =
                    Math.random() * 100 + "vh";

                heart.style.fontSize =
                    (20 + Math.random() * 30) + "px";

                heart.style.zIndex = "100";

                heart.style.pointerEvents = "none";

                document.body.appendChild(heart);


                heart.animate(
                    [
                        {
                            transform: "scale(0) rotate(0deg)",
                            opacity: 1
                        },

                        {
                            transform:
                                "scale(1.5) rotate(180deg)",
                            opacity: 1
                        },

                        {
                            transform:
                                "translateY(-300px) scale(0.5) rotate(360deg)",
                            opacity: 0
                        }
                    ],
                    {
                        duration:
                            1500 + Math.random() * 1500,

                        easing: "ease-out"
                    }
                );


                setTimeout(() => {

                    heart.remove();

                }, 3500);

            }

        }

    </script>

</body>
</html>
