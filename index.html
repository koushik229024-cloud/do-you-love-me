<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Do You Love Me? ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at 20% 20%, #ffb3c6, transparent 35%),
                radial-gradient(circle at 80% 80%, #ff4d88, transparent 35%),
                linear-gradient(135deg, #ff758c, #ff7eb3);

            position: relative;
        }

        /* CARD */

        .card {
            width: 90%;
            max-width: 520px;
            padding: 45px 25px;

            background: rgba(255,255,255,0.94);
            border-radius: 30px;

            text-align: center;

            box-shadow: 0 20px 60px rgba(0,0,0,0.25);

            position: relative;
            z-index: 10;

            animation: appear 1s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* HEART */

        .big-heart {
            font-size: 75px;
            animation: beat 1.2s infinite;
            margin-bottom: 15px;
        }

        @keyframes beat {
            0%,100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        /* TEXT */

        h1 {
            color: #ff3f6c;
            font-size: 38px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 35px;
        }

        /* BUTTONS */

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        button {
            border: none;
            padding: 14px 30px;
            border-radius: 50px;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        #yesBtn {
            background: linear-gradient(135deg,#ff416c,#ff4b2b);
            color: white;

            box-shadow: 0 8px 20px rgba(255,65,108,.4);

            transition: .25s;
        }

        #yesBtn:hover {
            transform: scale(1.1);
        }

        #noBtn {
            background: #555;
            color: white;

            position: fixed;

            transition:
                left .15s ease,
                top .15s ease;
        }

        /* SUCCESS */

        #success {
            display: none;
        }

        #success h2 {
            color: #ff2f68;
            font-size: 42px;
            margin: 10px 0;
        }

        #success p {
            color: #666;
            font-size: 19px;
            line-height: 1.7;
        }

        .love {
            font-size: 65px;
            margin: 15px 0;

            animation: lovePop 1s infinite alternate;
        }

        @keyframes lovePop {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.15);
            }
        }

        /* FLOATING HEARTS */

        .floating-heart {
            position: fixed;
            bottom: -50px;

            font-size: 25px;

            pointer-events: none;

            animation: floatUp linear forwards;

            z-index: 2;
        }

        @keyframes floatUp {
            0% {
                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            100% {
                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }
        }

        /* ROMANTIC EXPLOSION */

        .explosion {
            position: fixed;

            left: 50%;
            top: 50%;

            transform: translate(-50%,-50%);

            font-size: 30px;

            pointer-events: none;

            z-index: 100;

            animation: explode 2s ease-out forwards;
        }

        @keyframes explode {

            0% {
                transform:
                    translate(-50%,-50%)
                    scale(.2);

                opacity: 1;
            }

            100% {
                transform:
                    translate(
                        calc(-50% + var(--x)),
                        calc(-50% + var(--y))
                    )
                    scale(1.5)
                    rotate(360deg);

                opacity: 0;
            }
        }

        /* MOBILE */

        @media(max-width:600px) {

            .card {
                padding: 35px 20px;
            }

            h1 {
                font-size: 30px;
            }

            #success h2 {
                font-size: 34px;
            }

            #success p {
                font-size: 17px;
            }

            .big-heart {
                font-size: 65px;
            }
        }

    </style>
</head>


<body>

    <div class="card">

        <!-- QUESTION -->

        <div id="question">

            <div class="big-heart">
                ❤️
            </div>

            <h1>
                Do you love me?
            </h1>

            <p class="subtitle">
                Be honest... 😌💕
            </p>

            <div class="buttons">

                <button id="yesBtn">
                    Yes ❤️
                </button>

                <button id="noBtn">
                    No 😢
                </button>

            </div>

        </div>


        <!-- AFTER YES -->

        <div id="success">

            <div class="love">
                💖🥰💖
            </div>

            <h2>
                I Love You ❤️
            </h2>

            <p>
                I knew you loved me! 😍<br>
                You just made my heart<br>
                very, very happy! 💕
            </p>

            <div class="love">
                💕✨💗✨💕
            </div>

        </div>

    </div>


    <script>

        const yesBtn =
            document.getElementById("yesBtn");

        const noBtn =
            document.getElementById("noBtn");

        const question =
            document.getElementById("question");

        const success =
            document.getElementById("success");


        /* -----------------------------
           NO BUTTON RUNS AWAY
        ----------------------------- */

        function moveNoButton() {

            const width =
                noBtn.offsetWidth;

            const height =
                noBtn.offsetHeight;

            const maxX =
                window.innerWidth - width - 15;

            const maxY =
                window.innerHeight - height - 15;

            const x =
                Math.random() * Math.max(maxX,20);

            const y =
                Math.random() * Math.max(maxY,20);

            noBtn.style.left =
                x + "px";

            noBtn.style.top =
                y + "px";
        }


        noBtn.addEventListener(
            "mouseenter",
            moveNoButton
        );


        noBtn.addEventListener(
            "touchstart",
            function(e) {

                e.preventDefault();

                moveNoButton();

            }
        );


        noBtn.addEventListener(
            "click",
            moveNoButton
        );


        /* -----------------------------
           YES BUTTON
        ----------------------------- */

        yesBtn.addEventListener(
            "click",
            function() {

                /* Question hide */

                question.style.display =
                    "none";

                noBtn.style.display =
                    "none";


                /* Love screen */

                success.style.display =
                    "block";


                /* Romantic effects */

                romanticExplosion();

                startFloatingHearts();

            }
        );


        /* -----------------------------
           ROMANTIC EXPLOSION
        ----------------------------- */

        function romanticExplosion() {

            const emojis = [
                "❤️",
                "💖",
                "💕",
                "💗",
                "💘",
                "💝",
                "✨",
                "🥰",
                "😍"
            ];


            for(let i = 0; i < 70; i++) {

                const item =
                    document.createElement("div");

                item.className =
                    "explosion";

                item.innerHTML =
                    emojis[
                        Math.floor(
                            Math.random()
                            * emojis.length
                        )
                    ];


                const angle =
                    Math.random()
                    * Math.PI
                    * 2;

                const distance =
                    150 +
                    Math.random() * 400;


                item.style.setProperty(
                    "--x",
                    Math.cos(angle)
                    * distance
                    + "px"
                );

                item.style.setProperty(
                    "--y",
                    Math.sin(angle)
                    * distance
                    + "px"
                );


                document.body.appendChild(item);


                setTimeout(
                    () => item.remove(),
                    2200
                );

            }

        }


        /* -----------------------------
           FLOATING HEARTS
        ----------------------------- */

        function startFloatingHearts() {

            const hearts = [
                "❤️",
                "💖",
                "💕",
                "💗",
                "💘",
                "💝",
                "✨"
            ];


            setInterval(function() {

                const heart =
                    document.createElement("div");

                heart.className =
                    "floating-heart";

                heart.innerHTML =
                    hearts[
                        Math.floor(
                            Math.random()
                            * hearts.length
                        )
                    ];


                heart.style.left =
                    Math.random()
                    * 100
                    + "vw";


                heart.style.fontSize =
                    20 +
                    Math.random() * 35
                    + "px";


                heart.style.animationDuration =
                    4 +
                    Math.random() * 5
                    + "s";


                document.body.appendChild(
                    heart
                );


                setTimeout(
                    () => heart.remove(),
                    9000
                );

            }, 180);

        }

    </script>

</body>
</html>
