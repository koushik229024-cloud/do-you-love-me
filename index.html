<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Do You Love Me? ❤️</title>


    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
        ========================= */

        body {

            min-height: 100vh;

            overflow: hidden;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            position: relative;


            background:

                radial-gradient(
                    circle at 10% 10%,
                    #ffd1dc 0%,
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 90%,
                    #ff4f8b 0%,
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #ff758c,
                    #ff7eb3
                );

        }


        /* =========================
           SOFT BACKGROUND GLOW
        ========================= */

        body::before {

            content: "";

            position: fixed;

            width: 300px;
            height: 300px;

            background: #ffffff;

            border-radius: 50%;

            filter: blur(120px);

            opacity: 0.25;

            top: -100px;
            left: -100px;

            pointer-events: none;

        }


        body::after {

            content: "";

            position: fixed;

            width: 300px;
            height: 300px;

            background: #ff005d;

            border-radius: 50%;

            filter: blur(130px);

            opacity: 0.18;

            bottom: -100px;
            right: -100px;

            pointer-events: none;

        }


        /* =========================
           MAIN CARD
        ========================= */

        .card {

            width: 90%;

            max-width: 520px;

            min-height: 390px;

            padding: 45px 25px;


            background:
                rgba(255, 255, 255, 0.94);


            backdrop-filter:
                blur(15px);


            -webkit-backdrop-filter:
                blur(15px);


            border:
                1px solid
                rgba(255,255,255,0.7);


            border-radius:
                30px;


            text-align:
                center;


            box-shadow:

                0 25px 70px
                rgba(100, 0, 40, 0.25);


            position:
                relative;


            z-index:
                10;


            animation:
                cardAppear 1s ease;

        }


        @keyframes cardAppear {

            0% {

                opacity: 0;

                transform:
                    scale(0.75)
                    translateY(30px);

            }

            100% {

                opacity: 1;

                transform:
                    scale(1)
                    translateY(0);

            }

        }


        /* =========================
           BIG HEART
        ========================= */

        .big-heart {

            font-size:
                78px;

            margin-bottom:
                15px;

            display:
                inline-block;

            animation:
                heartbeat 1.2s
                infinite;

        }


        @keyframes heartbeat {

            0%,
            100% {

                transform:
                    scale(1);

            }

            50% {

                transform:
                    scale(1.18);

            }

        }


        /* =========================
           QUESTION
        ========================= */

        h1 {

            color:
                #ff3767;

            font-size:
                38px;

            font-weight:
                700;

            margin-bottom:
                12px;

        }


        .subtitle {

            color:
                #777;

            font-size:
                17px;

            margin-bottom:
                32px;

        }


        /* =========================
           BUTTON AREA
        ========================= */

        .buttons {

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            gap:
                18px;

            min-height:
                60px;

        }


        /* =========================
           BUTTON COMMON
        ========================= */

        button {

            border:
                none;

            outline:
                none;

            padding:
                14px 30px;

            border-radius:
                50px;

            font-size:
                18px;

            font-weight:
                bold;

            cursor:
                pointer;

            user-select:
                none;

            -webkit-user-select:
                none;

            -webkit-tap-highlight-color:
                transparent;

        }


        /* =========================
           YES BUTTON
        ========================= */

        #yesBtn {

            color:
                white;

            background:

                linear-gradient(
                    135deg,
                    #ff416c,
                    #ff174f
                );


            box-shadow:

                0 8px 25px
                rgba(255, 40, 90, 0.35);


            transition:
                transform 0.25s,
                box-shadow 0.25s;

        }


        #yesBtn:hover {

            transform:
                scale(1.08);

            box-shadow:

                0 12px 35px
                rgba(255, 40, 90, 0.5);

        }


        #yesBtn:active {

            transform:
                scale(0.96);

        }


        /* =========================
           NO BUTTON
           IMPORTANT:
           STARTS NEXT TO YES
        ========================= */

        #noBtn {

            color:
                white;

            background:
                #555;


            position:
                static;


            transition:
                left 0.12s ease,
                top 0.12s ease,
                transform 0.12s ease;

        }


        /* =========================
           SUCCESS SCREEN
        ========================= */

        #success {

            display:
                none;

            animation:
                successAppear 1s ease;

        }


        @keyframes successAppear {

            0% {

                opacity:
                    0;

                transform:
                    scale(0.5);

            }

            100% {

                opacity:
                    1;

                transform:
                    scale(1);

            }

        }


        /* =========================
           SUCCESS HEARTS
        ========================= */

        .love {

            font-size:
                65px;

            margin:
                8px 0;

            display:
                inline-block;

            animation:
                loveBeat 1s
                infinite alternate;

        }


        @keyframes loveBeat {

            from {

                transform:
                    scale(1);

            }

            to {

                transform:
                    scale(1.15);

            }

        }


        /* =========================
           I LOVE YOU
        ========================= */

        #success h2 {

            color:
                #ff2460;

            font-size:
                44px;

            margin:
                12px 0;


            animation:
                loveGlow 1.5s
                infinite alternate;

        }


        @keyframes loveGlow {

            from {

                transform:
                    scale(1);

                text-shadow:

                    0 0 5px
                    rgba(255,70,110,0.3);

            }

            to {

                transform:
                    scale(1.1);

                text-shadow:

                    0 0 10px
                    #ff4d6d,

                    0 0 25px
                    #ff8fab,

                    0 0 45px
                    #ffc0cb;

            }

        }


        /* =========================
           SUCCESS MESSAGE
        ========================= */

        #success p {

            color:
                #666;

            font-size:
                18px;

            line-height:
                1.7;

            margin-top:
                8px;

        }


        .final-love {

            margin-top:
                24px;

            font-size:
                27px;

            font-weight:
                bold;

            color:
                #ff2460;

            animation:
                finalPulse 1.4s
                infinite;

        }


        @keyframes finalPulse {

            0%,
            100% {

                transform:
                    scale(1);

            }

            50% {

                transform:
                    scale(1.12);

            }

        }


        /* =========================
           FLOATING HEARTS
        ========================= */

        .floating-heart {

            position:
                fixed;

            bottom:
                -60px;

            pointer-events:
                none;

            z-index:
                2;

            animation:
                floatUp
                linear
                forwards;

        }


        @keyframes floatUp {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg)
                    scale(0.7);

                opacity:
                    0;

            }

            10% {

                opacity:
                    1;

            }

            100% {

                transform:
                    translateY(-115vh)
                    rotate(360deg)
                    scale(1.25);

                opacity:
                    0;

            }

        }


        /* =========================
           HEART EXPLOSION
        ========================= */

        .explosion {

            position:
                fixed;

            left:
                50%;

            top:
                50%;

            font-size:
                30px;

            pointer-events:
                none;

            z-index:
                100;

            animation:
                explode 2s
                ease-out
                forwards;

        }


        @keyframes explode {

            0% {

                transform:

                    translate(
                        -50%,
                        -50%
                    )

                    scale(0.2)

                    rotate(0deg);

                opacity:
                    1;

            }

            100% {

                transform:

                    translate(

                        calc(
                            -50% + var(--x)
                        ),

                        calc(
                            -50% + var(--y)
                        )

                    )

                    scale(1.5)

                    rotate(360deg);

                opacity:
                    0;

            }

        }


        /* =========================
           SPARKLES
        ========================= */

        .sparkle {

            position:
                fixed;

            pointer-events:
                none;

            z-index:
                101;

            animation:
                sparkleAnimation
                1.5s
                ease-out
                forwards;

        }


        @keyframes sparkleAnimation {

            0% {

                transform:
                    scale(0)
                    rotate(0deg);

                opacity:
                    1;

            }

            50% {

                transform:
                    scale(1.5)
                    rotate(180deg);

                opacity:
                    1;

            }

            100% {

                transform:
                    scale(0)
                    rotate(360deg);

                opacity:
                    0;

            }

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .card {

                width:
                    92%;

                padding:
                    35px 18px;

                min-height:
                    350px;

            }


            .big-heart {

                font-size:
                    65px;

            }


            h1 {

                font-size:
                    30px;

            }


            .subtitle {

                font-size:
                    15px;

            }


            button {

                padding:
                    12px 23px;

                font-size:
                    16px;

            }


            #success h2 {

                font-size:
                    34px;

            }


            #success p {

                font-size:
                    16px;

            }


            .final-love {

                font-size:
                    23px;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         MAIN CARD
    ========================= -->

    <div class="card">


        <!-- =====================
             QUESTION
        ====================== -->

        <div id="question">


            <div class="big-heart">
                ❤️
            </div>


            <h1>
                Do you love me?
            </h1>


            <p class="subtitle">
                Be honest... 😌💕
            </p>


            <div class="buttons">


                <button id="yesBtn">
                    Yes ❤️
                </button>


                <button id="noBtn">
                    No 😢
                </button>


            </div>


        </div>



        <!-- =====================
             SUCCESS
        ====================== -->

        <div id="success">


            <div class="love">
                💖🥰💖
            </div>


            <h2>
                I LOVE YOU ❤️
            </h2>


            <p>

                I knew you loved me! 😍

                <br>

                You just made my heart
                very, very happy! 💕

            </p>


            <div class="final-love">

                ❤️ I LOVE YOU ❤️

            </div>


            <div class="love">

                💕✨💗✨💕

            </div>


        </div>


    </div>



    <script>


        /* =========================
           ELEMENTS
        ========================= */

        const yesBtn =
            document.getElementById(
                "yesBtn"
            );


        const noBtn =
            document.getElementById(
                "noBtn"
            );


        const question =
            document.getElementById(
                "question"
            );


        const success =
            document.getElementById(
                "success"
            );



        /* =========================
           MOVE NO BUTTON
           
           IMPORTANT:
           NO mouseenter নেই।
           
           তাই কাছে গেলেই নড়বে না।
           
           শুধু click/tap করার সময়
           পালাবে।
        ========================= */

        function moveNoButton() {


            /* প্রথমবার পালানোর সময়
               fixed position হবে */

            noBtn.style.position =
                "fixed";


            const width =
                noBtn.offsetWidth;


            const height =
                noBtn.offsetHeight;


            const maxX =
                window.innerWidth
                - width
                - 15;


            const maxY =
                window.innerHeight
                - height
                - 15;


            const x =
                15 +
                Math.random()
                *
                Math.max(
                    maxX - 15,
                    20
                );


            const y =
                15 +
                Math.random()
                *
                Math.max(
                    maxY - 15,
                    20
                );


            noBtn.style.left =
                x + "px";


            noBtn.style.top =
                y + "px";

        }



        /* =========================
           DESKTOP CLICK
        ========================= */

        noBtn.addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                moveNoButton();

            }
        );



        /* =========================
           MOBILE TAP
        ========================= */

        noBtn.addEventListener(
            "touchstart",
            function(event) {

                event.preventDefault();

                moveNoButton();

            },
            {
                passive: false
            }
        );



        /* =========================
           YES BUTTON
        ========================= */

        yesBtn.addEventListener(
            "click",
            function() {


                /* Question disappear */

                question.style.display =
                    "none";


                /* No disappear */

                noBtn.style.display =
                    "none";


                /* Success show */

                success.style.display =
                    "block";


                /* Romantic effects */

                romanticExplosion();

                sparkleExplosion();

                startFloatingHearts();

            }
        );



        /* =========================
           ROMANTIC HEART EXPLOSION
        ========================= */

        function romanticExplosion() {


            const emojis = [

                "❤️",
                "💖",
                "💕",
                "💗",
                "💘",
                "💝",
                "🥰",
                "😍",
                "💓",
                "💞"

            ];


            for (
                let i = 0;
                i < 80;
                i++
            ) {


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "explosion";


                item.innerHTML =
                    emojis[
                        Math.floor(
                            Math.random()
                            * emojis.length
                        )
                    ];


                const angle =
                    Math.random()
                    * Math.PI
                    * 2;


                const distance =
                    150 +
                    Math.random()
                    * 450;


                item.style.setProperty(

                    "--x",

                    Math.cos(angle)
                    * distance
                    + "px"

                );


                item.style.setProperty(

                    "--y",

                    Math.sin(angle)
                    * distance
                    + "px"

                );


                document.body.appendChild(
                    item
                );


                setTimeout(
                    function() {

                        item.remove();

                    },
                    2200
                );

            }

        }



        /* =========================
           SPARKLE EFFECT
        ========================= */

        function sparkleExplosion() {


            const sparkles = [

                "✨",
                "⭐",
                "💫",
                "🌟"

            ];


            for (
                let i = 0;
                i < 45;
                i++
            ) {


                const sparkle =
                    document.createElement(
                        "div"
                    );


                sparkle.className =
                    "sparkle";


                sparkle.innerHTML =
                    sparkles[
                        Math.floor(
                            Math.random()
                            * sparkles.length
                        )
                    ];


                sparkle.style.left =
                    Math.random()
                    * 100
                    + "vw";


                sparkle.style.top =
                    Math.random()
                    * 100
                    + "vh";


                sparkle.style.fontSize =
                    15 +
                    Math.random()
                    * 30
                    + "px";


                document.body.appendChild(
                    sparkle
                );


                setTimeout(
                    function() {

                        sparkle.remove();

                    },
                    1600
                );

            }

        }



        /* =========================
           FLOATING HEARTS
        ========================= */

        function startFloatingHearts() {


            const hearts = [

                "❤️",
                "💖",
                "💕",
                "💗",
                "💘",
                "💝",
                "💓",
                "✨"

            ];


            setInterval(
                function() {


                    const heart =
                        document.createElement(
                            "div"
                        );


                    heart.className =
                        "floating-heart";


                    heart.innerHTML =
                        hearts[
                            Math.floor(
                                Math.random()
                                * hearts.length
                            )
                        ];


                    heart.style.left =
                        Math.random()
                        * 100
                        + "vw";


                    heart.style.fontSize =
                        20 +
                        Math.random()
                        * 35
                        + "px";


                    heart.style.animationDuration =
                        4 +
                        Math.random()
                        * 5
                        + "s";


                    document.body.appendChild(
                        heart
                    );


                    setTimeout(
                        function() {

                            heart.remove();

                        },
                        9000
                    );


                },
                180
            );

        }


    </script>


</body>

</html>
